apiVersion: config.kueue.x-k8s.io/v1beta2
kind: Configuration
namespace: kueue-system
health:
  healthProbeBindAddress: :8081
metrics:
  bindAddress: :8443
webhook:
  port: 9443
leaderElection:
  leaderElect: true
  resourceName: c1f6bfd2.kueue.x-k8s.io
  # Upstream defaults are 15s/10s/2s, so a 10s apiserver or etcd stall costs
  # the lease and restarts the controller (it did at 19:49 UTC on 2026-10-16,
  # when kube-scheduler and kube-controller-manager lost theirs too). Kueue
  # releases the lease on graceful shutdown, so rollouts still hand over at
  # once; only a crashed leader leaves admission paused for up to 60s.
  leaseDuration: 60s
  renewDeadline: 40s
  retryPeriod: 5s
controller:
  groupKindConcurrency:
    Job.batch: 5
    Workload.kueue.x-k8s.io: 5
    LocalQueue.kueue.x-k8s.io: 1
    Cohort.kueue.x-k8s.io: 1
    ClusterQueue.kueue.x-k8s.io: 1
    ResourceFlavor.kueue.x-k8s.io: 1
clientConnection:
  qps: 50
  burst: 100
manageJobsWithoutQueueName: true
managedJobsNamespaceSelector:
  matchLabels:
    managed-by-kueue: "true"
featureGates:
  # v0.19 turned WaitForPodsReady on by default (30m timeout, then evict and
  # requeue). Keep it off, as it was through v0.18, until NRP opts in.
  DisableWaitForPodsReady: true
integrations:
  frameworks:
    - "batch/job"
