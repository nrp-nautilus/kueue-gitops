apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Upstream release manifest, vendored unmodified from
# https://github.com/kubernetes-sigs/kueue/releases/download/v0.20.2/manifests.yaml
# To upgrade: add upstream/<new>/manifests.yaml, point this at it, and
# re-check controller_manager_config.yaml against the new release's defaults.
resources:
  - upstream/v0.20.2/manifests.yaml
  - flowschema.yaml

# Replace the upstream ConfigMap with the NRP configuration. The name stays
# fixed (no hash suffix) because Kueue reads it by name; a config change needs
# `kubectl rollout restart -n kueue-system deploy/kueue-controller-manager`.
configMapGenerator:
  - name: kueue-manager-config
    namespace: kueue-system
    behavior: replace
    files:
      - controller_manager_config.yaml
generatorOptions:
  disableNameSuffixHash: true

patches:
  - path: patches/namespace.yaml
  - path: patches/deployment.yaml
  # Never let Argo CD delete the CRDs: removing them deletes every
  # ClusterQueue, LocalQueue and Workload in the cluster.
  - target:
      kind: CustomResourceDefinition
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-options
        value: Delete=false
  # Drop the unserved v1beta1 version. v0.20 lists it with served: false, but
  # every kube-apiserver still builds a watch cache for it and retries a
  # v1beta2 -> v1beta1 conversion about once a second, which Kueue's webhook
  # rejects with a 404 (about 500k failed calls a day). Safe because
  # status.storedVersions is [v1beta2] on all five CRDs. Upstream v0.21 ships
  # these CRDs with only v1beta2: the `test` op fails the build there, so
  # remove this patch on that upgrade. Keep conversion.strategy: Webhook;
  # see README "Safety".
  - target:
      group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: (clusterqueues|cohorts|localqueues|multikueueclusters|workloads)\.kueue\.x-k8s\.io
    patch: |-
      - op: test
        path: /spec/versions/0/name
        value: v1beta1
      - op: remove
        path: /spec/versions/0
